<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="description" content="A personal Warhammer army painting log and model collection." />
    <title>Librarium of Miniature Armies</title>
    <link rel="icon" href="assets/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Michroma&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <aside class="sidebar" id="sidebar" aria-label="Army navigation">
      <button class="menu-close" id="menu-close" type="button" aria-label="Close army menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <a class="brand" href="#" aria-label="Librarium of Miniature Armies home">
        <span class="brand-symbol" aria-hidden="true"><img src="assets/logo.png" alt="" width="81" height="101" /></span>
        <span class="brand-type"><strong>Librarium</strong><em>of</em><small>Miniature Armies</small></span>
      </a>
      <nav class="army-nav" id="army-nav" aria-label="Select an army"></nav>
    </aside>

    <div class="mobile-scrim" id="mobile-scrim" hidden></div>
    <main class="main">
      <header class="topbar">
        <button class="menu-button" id="menu-button" aria-label="Open army menu" aria-expanded="false" aria-controls="sidebar"><span></span><span></span><span></span></button>
        <a class="topbar-title" href="#">Librarium</a>
      </header>

      <div class="page-content">
        <div id="home-view" hidden>
          <section class="army-hero" aria-labelledby="home-title">
            <div class="hero-copy">
              <div class="eyebrow">Miniatures Painting Log</div>
              <div class="title-row"><h1 id="home-title">My Collection</h1></div>
            </div>
            <div class="hero-progress" aria-label="Painting progress across all armies"><div class="hero-progress-text"><span class="stat-number" id="home-progress">0</span><span class="pct">%</span> Painted</div><div class="hero-progress-track"><div class="progress-fill" id="home-fill"></div></div></div>
          </section>
          <div id="home-armies"></div>
        </div>
        <div id="army-view">
          <section class="army-hero" aria-labelledby="army-title">
            <div class="hero-copy">
              <div class="title-row"><span class="title-emblem" id="hero-emblem" aria-hidden="true"></span><h1 id="army-title"></h1></div>
            </div>
            <div class="hero-progress" id="stats-grid" aria-label="Painting progress"><div class="hero-progress-text"><span class="stat-number" id="stat-progress">0</span><span class="pct">%</span> Painted</div><div class="hero-progress-track"><div class="progress-fill" id="progress-fill"></div></div></div>
          </section>

          <section class="roster" aria-label="Model roster">
            <div class="controls">
              <div class="filters" role="group" aria-label="Filter model status"><button type="button" class="filter active" data-filter="all" aria-pressed="true">All models <span id="filter-all-count">0</span></button><button type="button" class="filter" data-filter="done" aria-pressed="false">Completed <span id="filter-done-count">0</span></button><button type="button" class="filter" data-filter="ongoing" aria-pressed="false">Ongoing <span id="filter-ongoing-count">0</span></button><button type="button" class="filter" data-filter="backlog" aria-pressed="false">Backlog <span id="filter-backlog-count">0</span></button></div>
              <label class="searchbox"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="1.5"/></svg><span class="sr-only">Search models</span><input id="model-search" type="search" placeholder="Search the roster..." autocomplete="off" /><span class="search-shortcut" aria-hidden="true">/</span></label>
            </div>
            <div class="roster-grid" id="roster-grid" aria-live="polite"></div>
            <div class="empty-state" id="empty-state" hidden><div class="empty-mark" id="empty-mark"></div><p class="empty-overline" id="empty-overline"></p><h3 id="empty-title"></h3><p id="empty-message"></p><div class="empty-path" id="empty-path"></div></div>
          </section>
        </div>
        <footer class="footer"><span id="footer-motto"></span></footer>
      </div>
    </main>

    <dialog class="model-dialog" id="model-dialog" aria-labelledby="dialog-title">
      <div class="dialog-container" tabindex="-1" autofocus>
        <button class="dialog-close" type="button" id="dialog-close" aria-label="Close model details"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        <div class="dialog-media" id="dialog-media"></div>
        <div class="dialog-info">
          <div class="dialog-kicker" id="dialog-kicker"></div>
          <h2 id="dialog-title"></h2>
          <div class="dialog-divider"></div>
          <div class="dialog-content" id="dialog-content"></div>
        </div>
      </div>
    </dialog>
  </body>
</html>
